<?xml version="1.0" encoding="UTF-8"?>
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 240 56"
             width="240" height="56"
             role="img"
             aria-label="TASMail">
          <title>TASMail</title>

          <g transform="translate(2,4) scale(2)">
            <!-- envelope outline -->
<rect x="3.5" y="6"  width="17" height="12"
      rx="1.4" ry="1.4"
      fill="none" stroke="#2563eb" stroke-width="1.6"
      stroke-linejoin="round"/>
<!-- top flap: single inverted V meeting at the midpoint -->
<path d="M 3.5 6 L 12 13.2 L 20.5 6"
      fill="none" stroke="#2563eb" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/>

<!-- inner wordmark t@s — baseline y=16.6 (lower half of envelope) -->
<g font-family="'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif"
   font-weight="700"
   text-anchor="middle">
  <text x="8.6"  y="16.7" font-size="4.6" letter-spacing="-0.12" fill="#2563eb">t</text>
  <text x="12"   y="16.95" font-size="5.2" letter-spacing="-0.12" fill="#2dd4bf">@</text>
  <text x="15.4" y="16.7" font-size="4.6" letter-spacing="-0.12" fill="#2563eb">s</text>
</g>
          </g>
          <text x="64" y="38"
                font-family="'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif"
                font-size="28"
                font-weight="800"
                letter-spacing="-0.6"
                fill="#2563eb">TASMail</text>
        </svg>
