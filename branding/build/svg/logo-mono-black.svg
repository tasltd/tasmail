<?xml version="1.0" encoding="UTF-8"?>
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24"
             width="512" height="512"
             role="img"
             aria-label="TASMail">
          <title>TASMail</title>

          <!-- envelope outline -->
<rect x="3.5" y="6"  width="17" height="12"
      rx="1.4" ry="1.4"
      fill="none" stroke="#0f172a" stroke-width="1.6"
      stroke-linejoin="round"/>
<!-- top flap: single inverted V meeting at the midpoint -->
<path d="M 3.5 6 L 12 13.2 L 20.5 6"
      fill="none" stroke="#0f172a" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/>

<!-- inner wordmark t@s — baseline y=16.6 (lower half of envelope) -->
<g font-family="'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif"
   font-weight="700"
   text-anchor="middle">
  <text x="8.6"  y="16.7" font-size="4.6" letter-spacing="-0.12" fill="#0f172a">t</text>
  <text x="12"   y="16.95" font-size="5.2" letter-spacing="-0.12" fill="#0f172a">@</text>
  <text x="15.4" y="16.7" font-size="4.6" letter-spacing="-0.12" fill="#0f172a">s</text>
</g>
        </svg>
