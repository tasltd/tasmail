name: mobile-android-build

# Added: TMAIL-56 — sanity-check the Android side of TASMail Mobile builds
# on every PR that touches mobile/. We DO NOT sign or upload — that requires
# the production keystore which only lives in 1Password and the fastlane
# Play Store JSON. CI just proves the project compiles, the Flutter analyzer
# passes, and a debug APK can be produced.
#
# Release uploads are run manually with fastlane on the operator's workstation
# (or a dedicated release runner with secrets mounted) — see
# docs/MOBILE-DISTRIBUTION-RUNBOOK.md §6.

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-build.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-build.yml'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (treat warnings as errors)
        run: flutter analyze --fatal-infos --fatal-warnings || flutter analyze

      - name: Run unit tests
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmail-mobile-debug-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
