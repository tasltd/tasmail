[package]
name = "tasmail"
version = "0.1.0"
edition = "2024"
description = "TASMail - Self-hosted email service backend"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "compression-deflate", "trace", "limit", "set-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Added: Redis cache for session/branding/rate-limit caching
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"

# IMAP/SMTP
async-imap = "0.11"
imap-proto = "0.16"
async-native-tls = "0.5"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }
mailparse = "0.16"

# Configuration
toml = "0.8"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.9"
base64 = "0.22"
futures = "0.3"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
data-encoding = "2"
thiserror = "2"
anyhow = "1"
regex = "1"
csv = "1"
reqwest = { version = "0.12", features = ["json"] }
# Added: Prometheus metrics facade and exporter for TMAIL-41
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-process = "2.4"
# Added: AES-256-GCM encryption for AI API keys at rest (TMAIL-105)
aes-gcm = "0.10"
# Added: SAML AuthnRequest deflate compression and URL encoding for TMAIL-101
flate2 = "1"
urlencoding = "2"
# Added: Pure-async Postfix milter (no libmilter dep) for the DLP milter binary (TMAIL-108).
#        Only the dlp_milter [[bin]] target depends on this; the main backend
#        does not link against it. See docs/research/indymilter-dlp-milter.md.
indymilter = "0.3"
# Added: Bytes type used by indymilter body callback (TMAIL-108)
bytes = "1"
# Added: Pure-Rust async LDAP client for AD/LDAP user sync (TMAIL-100).
# Default features bring in tokio + rustls TLS for ldaps://. Kerberos/GSSAPI
# and NTLM are off by default — turn on later when the auth-side ticket lands.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls", "tls-rustls-ring"] }

# Added: DLP milter daemon for the optional self-host Postfix deployment (TMAIL-108)
[[bin]]
name = "dlp_milter"
path = "src/bin/dlp_milter.rs"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
# Added: HTTP body utilities for reading response bodies in integration tests
http-body-util = "0.1"
# Added: Query-string parsing in mobile handler tests (TMAIL-52). axum uses this
# transitively but we need it as a direct dep so the test code can import it.
serde_urlencoded = "0.7"
# Added: Criterion benchmarks for performance profiling critical paths (TMAIL-38)
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio = { version = "1", features = ["full"] }

# Added: Benchmark targets for auth, validation, and router performance (TMAIL-38)
[[bench]]
name = "auth_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false

[[bench]]
name = "router_bench"
harness = false
