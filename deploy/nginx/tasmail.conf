# Added: Nginx reverse proxy configuration for TASMail production deployment (TMAIL-40)
# PURPOSE: Serves the React SPA frontend, proxies API/WebSocket requests to the Rust backend,
#          and enforces security headers, rate limiting, SSL termination, and gzip compression.

# Added: Rate limiting zone for login endpoint — 5 requests/second per IP
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

# Added: Rate limiting zone for general API — 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Added: Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;

    # Added: ACME challenge for Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Added: Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.example.com;

    # Added: SSL certificate paths — managed by Let's Encrypt / certbot
    ssl_certificate /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;

    # Added: Modern SSL configuration (Mozilla intermediate compatibility)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Added: OCSP stapling for faster TLS handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Added: Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Added: Client max body size — 25MB for email attachments
    client_max_body_size 25m;

    # Added: Gzip compression for text-based responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Added: Frontend static files — React SPA with Vite build output
    root /var/www/tasmail/frontend/dist;
    index index.html;

    # Added: Static asset caching — immutable hashed filenames from Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Added: Service worker and manifest — short cache for PWA updates
    location ~* ^/(sw\.js|manifest\.webmanifest|workbox-.*)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Added: Prometheus metrics endpoint — proxied to backend, restricted to localhost (TMAIL-40)
    # NOTE: Extend the `allow` list with internal monitoring CIDRs (e.g. allow 10.0.0.0/8;)
    #       before enabling external Prometheus scraping.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3000/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Added: Keep metrics scrapes out of the access log to avoid log bloat
        access_log off;
    }

    # Added: WebSocket proxy for real-time notifications
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Added: Login endpoint with strict rate limiting
    location /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Added: API reverse proxy to Rust/Axum backend
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Added: Disable buffering for streaming responses (SSE, large downloads)
        proxy_buffering off;
    }

    # Added: SPA fallback — serve index.html for all non-file routes (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Added: Deny access to hidden files (dotfiles)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Added: Access and error logs
    access_log /var/log/nginx/tasmail_access.log;
    error_log /var/log/nginx/tasmail_error.log;
}
