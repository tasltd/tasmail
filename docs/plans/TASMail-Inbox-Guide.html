<body>
  <h1>TASMail — Inbox User Guide</h1>
  <p><strong>Product:</strong> Webmail UI for any IMAP/SMTP server (BYOK)</p>
  <p><strong>Live:</strong> <a href="https://mail.techatscale.io">https://mail.techatscale.io</a></p>

  <hr/>

  <div class="section">
    <h2>1. Inbox Navigation</h2>
    <p>The Inbox is the primary view for reading and managing incoming emails.</p>

    <div class="step">
      <span class="callout"><span class="badge">1</span> Login</span>
      <p>Navigate to <strong>https://mail.techatscale.io</strong> and sign in with your BYOK credentials.</p>
    </div>

    <div class="step">
      <span class="callout"><span class="badge">2</span> Select Inbox</span>
      <p>Click the <strong>Inbox</strong> folder in the sidebar tree. The message list loads via IMAP proxy.</p>
      <p><strong>Screenshot:</strong> <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcS9AAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Inbox page"></p>
    </div>

    <div class="step">
      <span class="callout"><span class="badge">3</span> Read Messages</span>
      <p>Click on any message to open the preview pane. Use <strong>Mark as Read</strong> / <strong>Mark as Unread</strong> buttons.</p>
      <p><strong>Screenshot:</strong> <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcS9AAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Read message preview"></p>
    </div>

    <div class="step">
      <span class="callout"><span class="badge">4</span> Filter / Sort</span>
      <p>Use the filter controls to sort by unread, starred, or sender. Use the search bar to filter by keyword.</p>
      <p><strong>Screenshot:</strong> <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcS9AAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Folder filter controls"></p>
    </div>

    <div class="step">
      <span class="callout"><span class="badge">5</span> Refresh</span>
      <p>Pull down to refresh or click the refresh button to fetch new messages from the IMAP server.</p>
      <p><strong>Screenshot:</strong> <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcS9AAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Refresh button"></p>
    </div>
  </div>

  <div class="section">
    <h2>2. Folder Management</h2>
    <p>TASMail uses IMAP-based folder storage. Your email server determines the available folders.</p>

    <p>Common folders:</p>
    <ul>
      <li><strong>Inbox</strong> — incoming emails (source of truth)</li>
      <li><strong>Sent</strong> — sent emails (auto-stored)</li>
      <li><strong>Drafts</strong> — unsent emails (auto-saved)</li>
      <li><strong>Junk / Spam</strong> — filtered spam messages</li>
      <li><strong>Archive</strong> — older emails (optional)</li>
      <li><strong>Trash</strong> — deleted emails (temporary)</li>
    </ul>

    <p>Folders can be managed through the <strong>Folder Tree</strong> in the sidebar. To create custom folders or shared mailboxes, contact your system administrator.</p>
  </div>

  <hr/>
  <p style="font-size:0.8em; color:#666;">Generated from E2E test screenshot evidence. All navigation performed by clicking (never <code>page.goto()</code> for internal routes per <a href="https://github.com/tasltd/tasmail">TASMail</a> plan rules).</p>
